<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VibeCTRL</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <div class="header">
        <div class="logo">V</div>
        <div class="title">VibeCTRL</div>
      </div>
      <div class="section">
        <div id="host" class="host">—</div>
        <button id="toggle" class="btn primary">Enable on this site</button>
        <div id="status" class="status off">Overlay: OFF</div>
      </div>
      <div class="section row">
        <button id="openDashboard" class="btn">Open Dashboard</button>
        <button id="openSettings" class="btn">Settings</button>
        <button id="help" class="btn">Help</button>
      </div>
      <div class="note">Video runs locally. No data leaves your device.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
